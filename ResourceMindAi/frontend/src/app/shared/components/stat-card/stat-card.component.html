<div class="rounded-lg border border-border bg-card p-4 ring-1" [ngClass]="getRingClass()">
      <div class="text-xs text-muted-foreground uppercase tracking-wider">{{ label }}</div>
      <div class="mt-2 text-2xl font-semibold font-mono">{{ value }}</div>
      <div *ngIf="hint" class="text-[11px] text-muted-foreground mt-1">{{ hint }}</div>
    </div>
