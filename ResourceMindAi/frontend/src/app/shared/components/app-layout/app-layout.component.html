<div class="flex min-h-screen bg-background text-foreground">
      <!-- Sidebar -->
      <aside class="hidden md:flex w-60 shrink-0 flex-col border-r border-border bg-sidebar">
        <div class="flex items-center gap-2 px-5 py-4 border-b border-border">
          <div class="h-8 w-8 rounded-md bg-gradient-to-br from-indigo-500 to-indigo-700 grid place-items-center text-white text-sm font-bold">R</div>
          <div class="leading-tight">
            <div class="text-sm font-semibold tracking-tight">ResourceMindAI</div>
            <div class="text-[10px] text-muted-foreground font-mono">v1.0</div>
          </div>
        </div>
        <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto">
          <a *ngFor="let item of navItems" [routerLink]="[item.to]" routerLinkActive="border-indigo-500 bg-indigo-500/10 text-foreground"
             [routerLinkActiveOptions]="{exact: false}"
             class="group flex items-center gap-3 rounded-md px-3 py-2 text-sm transition-colors border-l-2 border-transparent text-muted-foreground hover:bg-accent hover:text-foreground">
             <span class="material-symbols-outlined h-4 w-4" style="font-size: 16px; vertical-align: middle;">{{ item.icon }}</span>
             <span>{{ item.label }}</span>
          </a>
        </nav>
        <div class="border-t border-border p-3 flex items-center gap-3">
          <app-avatar [name]="user?.name" [size]="36"></app-avatar>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-medium truncate">{{ user?.name }}</div>
            <app-status-badge [status]="user?.roleLabel"></app-status-badge>
          </div>
        </div>
      </aside>
      
      <!-- Main -->
      <div class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-20 flex h-14 items-center justify-between border-b border-border bg-background/80 backdrop-blur px-4 md:px-6">
          <div class="flex items-center gap-2 text-sm">
            <span class="text-muted-foreground">{{ user?.roleLabel }}</span>
            <span class="text-muted-foreground/40">/</span>
            <span class="font-medium">{{ title }}</span>
          </div>
          <div class="flex items-center gap-2">
            <button class="h-8 w-8 grid place-items-center rounded-md hover:bg-accent text-muted-foreground" aria-label="Search">
              <span class="material-symbols-outlined h-4 w-4" style="font-size: 16px; vertical-align: middle;">search</span>
            </button>
            <button class="h-8 w-8 grid place-items-center rounded-md hover:bg-accent text-muted-foreground relative" aria-label="Notifications">
              <span class="material-symbols-outlined h-4 w-4" style="font-size: 16px; vertical-align: middle;">notifications</span>
              <span class="absolute top-1.5 right-1.5 h-1.5 w-1.5 rounded-full bg-indigo-500"></span>
            </button>
            <div class="h-6 w-px bg-border mx-1"></div>
            <button class="flex items-center gap-2 rounded-md hover:bg-accent px-2 h-8">
              <app-avatar [name]="user?.name" [size]="24"></app-avatar>
              <span class="text-sm hidden sm:inline">{{ user?.name }}</span>
              <span class="material-symbols-outlined h-3.5 w-3.5 text-muted-foreground" style="font-size: 16px; vertical-align: middle;">expand_more</span>
            </button>
            <a routerLink="/login" (click)="logout()" class="ml-1 inline-flex items-center gap-1.5 text-xs text-muted-foreground hover:text-foreground rounded-md px-2 h-8 cursor-pointer">
              <span class="material-symbols-outlined h-3.5 w-3.5" style="font-size: 16px; vertical-align: middle;">logout</span> Logout
            </a>
          </div>
        </header>
        <main class="flex-1 p-4 md:p-6 lg:p-8 min-w-0">
          <ng-content></ng-content>
        </main>
      </div>
    </div>
