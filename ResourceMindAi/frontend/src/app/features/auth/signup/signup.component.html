<app-auth-shell>
      <h2 class="text-lg font-semibold mb-5">Create Account</h2>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Full Name</label>
          <input formControlName="fullName" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" placeholder="Jane Doe" />
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Email Address</label>
          <input formControlName="email" type="email" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" placeholder="jane@company.com" />
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Username</label>
          <input formControlName="username" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" placeholder="jane.doe" />
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Password</label>
          <input formControlName="password" type="password" (input)="onPasswordInput($event)" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" />
          <div class="mt-2 flex items-center gap-2">
            <div class="h-1.5 flex-1 rounded-full bg-muted overflow-hidden">
              <div class="h-full transition-all" [ngClass]="strength().color" [style.width]="pw() ? strength().width : '0%'"></div>
            </div>
            <span class="text-[11px] text-muted-foreground w-12 text-right">{{ pw() ? strength().label : '—' }}</span>
          </div>
          <p class="text-[11px] text-muted-foreground mt-1">Min 8 characters, 1 uppercase, 1 number</p>
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Confirm Password</label>
          <input formControlName="confirmPassword" type="password" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" />
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Role</label>
          <select formControlName="role" class="flex h-9 w-full items-center justify-between rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-1 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50">
            <option value="" disabled selected class="text-muted-foreground">Select role</option>
            <option value="manager" class="bg-popover text-popover-foreground">Manager</option>
            <option value="employee" class="bg-popover text-popover-foreground">Employee</option>
          </select>
        </div>

        <button type="submit" [disabled]="signupForm.invalid" class="inline-flex mt-4 items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 w-full bg-indigo-600 hover:bg-indigo-500 text-white h-9 px-4 py-2">
          Create Account
        </button>

        <div class="text-center text-xs text-muted-foreground mt-4">
          Already have an account? <a routerLink="/login" class="text-indigo-400 hover:text-indigo-300">Sign In</a>
        </div>
      </form>
    </app-auth-shell>
