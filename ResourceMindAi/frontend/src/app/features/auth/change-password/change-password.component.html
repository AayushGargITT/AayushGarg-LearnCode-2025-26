<app-auth-shell>
      <div class="mb-5 border border-amber-500/30 bg-amber-500/10 text-amber-200 p-3 rounded-md flex items-start gap-3">
        <span class="material-symbols-outlined h-4 w-4 mt-0.5" style="font-size: 16px; vertical-align: middle;">security</span>
        <div class="text-sm">You must change your temporary password before continuing.</div>
      </div>
      
      <div class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none">New Password</label>
          <input type="password" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" placeholder="••••••••" />
          <div class="h-1.5 mt-2 rounded-full bg-muted overflow-hidden">
            <div class="h-full bg-emerald-500 transition-all" style="width: 70%"></div>
          </div>
          <p class="text-[11px] text-muted-foreground mt-1">Min 8 characters, 1 uppercase, 1 number</p>
        </div>
        
        <div class="space-y-1.5">
          <label class="text-sm font-medium leading-none">Confirm New Password</label>
          <input type="password" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" />
        </div>
        
        <a routerLink="/admin/dashboard" class="inline-flex mt-4 items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors w-full bg-indigo-600 hover:bg-indigo-500 text-white h-9 px-4 py-2">
          Update Password & Continue
        </a>
      </div>
    </app-auth-shell>
