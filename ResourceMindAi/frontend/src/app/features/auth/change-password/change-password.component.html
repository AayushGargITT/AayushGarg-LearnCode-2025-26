<app-auth-shell>
  <div class="mb-5 border border-amber-500/30 bg-amber-500/10 text-amber-200 p-3 rounded-md flex items-start gap-3">
    <span class="material-symbols-outlined h-4 w-4 mt-0.5" style="font-size: 16px; vertical-align: middle;">security</span>
    <div class="text-sm">You must change your temporary password before continuing.</div>
  </div>

  <div *ngIf="errorMessage()" class="mb-4 border border-rose-500/30 bg-rose-500/10 text-rose-200 p-3 rounded-md text-sm">
    {{ errorMessage() }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div class="space-y-1.5">
      <label for="currentPassword" class="text-sm font-medium leading-none">Current Password</label>
      <div class="relative">
        <input id="currentPassword" formControlName="currentPassword" [type]="showCurrent() ? 'text' : 'password'" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 pr-10 text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" />
        <button type="button" (click)="showCurrent.set(!showCurrent())" class="absolute right-2 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground outline-none">
          <span class="material-symbols-outlined h-4 w-4" style="font-size: 16px; vertical-align: middle;">{{ showCurrent() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <div class="space-y-1.5">
      <label for="newPassword" class="text-sm font-medium leading-none">New Password</label>
      <div class="relative">
        <input id="newPassword" formControlName="newPassword" [type]="showNew() ? 'text' : 'password'" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 pr-10 text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" />
        <button type="button" (click)="showNew.set(!showNew())" class="absolute right-2 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground outline-none">
          <span class="material-symbols-outlined h-4 w-4" style="font-size: 16px; vertical-align: middle;">{{ showNew() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
      <div class="h-1.5 mt-2 rounded-full bg-muted overflow-hidden">
        <div class="h-full bg-emerald-500 transition-all" [style.width.%]="passwordStrength()"></div>
      </div>
      <p class="text-[11px] text-muted-foreground mt-1">Min 8 characters, 1 uppercase, 1 number</p>
    </div>

    <div class="space-y-1.5">
      <label for="confirmPassword" class="text-sm font-medium leading-none">Confirm New Password</label>
      <div class="relative">
        <input id="confirmPassword" formControlName="confirmPassword" [type]="showConfirm() ? 'text' : 'password'" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 pr-10 text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" />
        <button type="button" (click)="showConfirm.set(!showConfirm())" class="absolute right-2 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground outline-none">
          <span class="material-symbols-outlined h-4 w-4" style="font-size: 16px; vertical-align: middle;">{{ showConfirm() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
      <p *ngIf="!passwordsMatch" class="text-[11px] text-rose-300 mt-1">Passwords do not match.</p>
    </div>

    <button type="submit" [disabled]="form.invalid || !passwordsMatch || isSubmitting()" class="inline-flex mt-4 items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors w-full bg-indigo-600 hover:bg-indigo-500 text-white h-9 px-4 py-2 disabled:pointer-events-none disabled:opacity-50">
      {{ isSubmitting() ? 'Updating...' : 'Update Password & Continue' }}
    </button>
  </form>
</app-auth-shell>
