<app-layout role="manager" title="AI Allocation">
      <app-page-header title="Allocate Resource" subtitle="Use AI to find the best match for your project needs"></app-page-header>
      
      <div class="grid lg:grid-cols-2 gap-6">
        <div class="rounded-lg border border-border bg-card p-6">
          <h3 class="font-medium mb-4">Project Requirements</h3>
          <div class="space-y-4">
            <div class="space-y-1.5">
              <label class="text-sm font-medium">Select Project</label>
              <select class="flex h-9 w-full items-center justify-between rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm ring-offset-background">
                <option value="p1" class="bg-popover text-popover-foreground">Atlas Payments</option>
                <option value="p2" class="bg-popover text-popover-foreground">Borealis CRM</option>
              </select>
            </div>
            <div class="space-y-1.5">
              <label class="text-sm font-medium">Requirement Description</label>
              <textarea rows="4" class="flex min-h-[80px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm" placeholder="Need a senior backend developer with C# and SQL experience for 20 hours a week..."></textarea>
            </div>
            <button (click)="findMatch()" class="inline-flex w-full items-center justify-center rounded-md text-sm font-medium transition-colors bg-indigo-600 hover:bg-indigo-500 text-white h-9 px-4 py-2">
              <span class="material-symbols-outlined h-4 w-4 mr-2" style="font-size: 16px; vertical-align: middle;" *ngIf="!loading()">auto_awesome</span>
              <span class="material-symbols-outlined h-4 w-4 mr-2 animate-spin" style="font-size: 16px; vertical-align: middle;" *ngIf="loading()">progress_activity</span>
              {{ loading() ? 'Finding matches...' : 'Find Matches with AI' }}
            </button>
          </div>
        </div>

        <div *ngIf="showResults()" class="space-y-4">
          <h3 class="font-medium text-sm text-muted-foreground uppercase tracking-wider">AI Recommendations</h3>
          
          <div class="rounded-lg border border-emerald-500/30 bg-card p-4 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
            <div class="flex items-start gap-4">
              <app-avatar name="Jonas Weber"></app-avatar>
              <div class="flex-1">
                <div class="flex items-center justify-between">
                  <div class="font-medium">Jonas Weber</div>
                  <span class="inline-flex items-center rounded-full border border-emerald-500/30 bg-emerald-500/15 px-2 py-0.5 text-[11px] font-medium text-emerald-300">95% Match</span>
                </div>
                <div class="text-sm text-muted-foreground">Frontend Engineer &middot; 40h free</div>
                <div class="mt-3 text-sm bg-muted/40 p-3 rounded-md text-muted-foreground border border-border">
                  Jonas is currently on the bench and has extensive React experience. His past timesheet tags show he recently completed a similar payment integration module.
                </div>
                <button class="mt-4 inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-secondary text-secondary-foreground hover:bg-secondary/80 h-9 px-4 py-2">
                  Allocate to Project
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </app-layout>
