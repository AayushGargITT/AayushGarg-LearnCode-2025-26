<app-layout role="manager" title="Timesheets">
  <app-page-header title="Team Timesheets" subtitle="Review submitted hours and activity tags"></app-page-header>

  <app-page-feedback type="error" [message]="pageState.errorMessage()"></app-page-feedback>

  <div class="surface kendo-grid-shell">
    <div *ngIf="pageState.isLoading()" class="hint-panel">Loading timesheets...</div>
    <div *ngIf="!pageState.isLoading() && rows().length === 0" class="hint-panel">No submitted timesheets found.</div>

    <kendo-grid *ngIf="!pageState.isLoading() && rows().length > 0" [data]="rows()" [height]="420" [resizable]="true">
      <kendo-grid-column title="Employee">
        <ng-template kendoGridCellTemplate let-dataItem>
          <div class="flex items-center gap-3">
            <app-avatar [name]="dataItem.employeeName" [size]="28"></app-avatar>
            <div class="font-medium">{{ dataItem.employeeName }}</div>
          </div>
        </ng-template>
      </kendo-grid-column>
      <kendo-grid-column field="projectName" title="Project" class="text-indigo-400 font-medium"></kendo-grid-column>
      <kendo-grid-column title="Week" [width]="150">
        <ng-template kendoGridCellTemplate let-dataItem>{{ dataItem.weekStartDate | date:'mediumDate' }}</ng-template>
      </kendo-grid-column>
      <kendo-grid-column title="Hours" [width]="100">
        <ng-template kendoGridCellTemplate let-dataItem><span class="font-mono">{{ dataItem.hoursLogged }}h</span></ng-template>
      </kendo-grid-column>
      <kendo-grid-column title="Activity Tags">
        <ng-template kendoGridCellTemplate let-dataItem>
          <div class="flex flex-wrap gap-1">
            <span *ngFor="let tag of dataItem.tags" class="inline-flex items-center rounded-md bg-muted px-2 py-0.5 text-xs font-medium text-muted-foreground border border-border">{{ tag }}</span>
          </div>
        </ng-template>
      </kendo-grid-column>
      <kendo-grid-column field="status" title="Status" [width]="130">
        <ng-template kendoGridCellTemplate let-dataItem>
          <app-status-badge [status]="dataItem.status"></app-status-badge>
        </ng-template>
      </kendo-grid-column>
    </kendo-grid>
  </div>
</app-layout>
