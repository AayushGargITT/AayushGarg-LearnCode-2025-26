<kendo-dialog title="Create User" [width]="460" (close)="cancel()">
  <p class="text-sm text-muted-foreground mb-4">
    Add a new account to ResourceMindAI. The initial password will match the username.
  </p>

  <app-page-feedback type="error" [message]="error"></app-page-feedback>

  <form [formGroup]="form" class="form-stack">
    <div class="field-stack">
      <label class="text-sm font-medium">Full Name</label>
      <input kendoTextBox formControlName="fullName" placeholder="Jane Doe" />
    </div>
    <div class="field-stack">
      <label class="text-sm font-medium">Email</label>
      <input kendoTextBox formControlName="email" type="email" />
    </div>
    <div class="field-stack">
      <label class="text-sm font-medium">Username</label>
      <input kendoTextBox formControlName="username" />
    </div>
    <div class="field-stack">
      <label class="text-sm font-medium">Role</label>
      <kendo-dropdownlist [data]="roles" formControlName="role"></kendo-dropdownlist>
    </div>
    <p class="hint-panel">User will be forced to change the initial password on first login.</p>
  </form>

  <kendo-dialog-actions>
    <button kendoButton (click)="cancel()" [disabled]="isSaving">Cancel</button>
    <button kendoButton themeColor="primary" (click)="submit()" [disabled]="isSaving">
      {{ isSaving ? 'Creating...' : 'Create User' }}
    </button>
  </kendo-dialog-actions>
</kendo-dialog>
