<kendo-dialog title="Assign Manager" [width]="480" (close)="cancel()">
  <p class="text-sm text-muted-foreground mb-4">
    Assign an active manager to {{ employee?.fullName }}.
  </p>

  <app-page-feedback type="error" [message]="error"></app-page-feedback>

  <div *ngIf="isLoading" class="hint-panel">Loading managers...</div>

  <form *ngIf="!isLoading" [formGroup]="form" class="form-stack">
    <div *ngIf="managers.length === 0" class="hint-panel">
      No active managers are available.
    </div>

    <div *ngIf="managers.length > 0" class="field-stack">
      <label class="text-sm font-medium">Manager</label>
      <kendo-dropdownlist
        [data]="managers"
        textField="fullName"
        valueField="id"
        [valuePrimitive]="true"
        formControlName="managerId">
      </kendo-dropdownlist>
      <span *ngIf="form.controls.managerId.touched && form.controls.managerId.invalid" class="text-xs text-rose-400">
        Manager is required.
      </span>
    </div>
  </form>

  <kendo-dialog-actions>
    <button kendoButton (click)="cancel()" [disabled]="isSaving">Cancel</button>
    <button
      kendoButton
      themeColor="primary"
      (click)="submit()"
      [disabled]="isSaving || isLoading || managers.length === 0">
      {{ isSaving ? 'Assigning...' : 'Assign Manager' }}
    </button>
  </kendo-dialog-actions>
</kendo-dialog>
