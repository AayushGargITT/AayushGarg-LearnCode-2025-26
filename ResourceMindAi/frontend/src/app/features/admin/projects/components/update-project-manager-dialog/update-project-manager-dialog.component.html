<kendo-dialog title="Update Project Manager" [width]="500" (close)="cancelled.emit()">
  <p class="text-sm text-muted-foreground mb-4">
    Select a new active manager for {{ project?.name }}.
  </p>

  <app-page-feedback type="error" [message]="error"></app-page-feedback>

  <form [formGroup]="form" class="form-stack">
    <div *ngIf="managers.length === 0" class="hint-panel">
      No other active managers are available.
    </div>

    <div *ngIf="managers.length > 0" class="field-stack">
      <label class="text-sm font-medium">New Manager</label>
      <kendo-dropdownlist
        [data]="managers"
        textField="fullName"
        valueField="id"
        [valuePrimitive]="true"
        formControlName="newManagerId">
      </kendo-dropdownlist>
      <span *ngIf="form.controls.newManagerId.touched && form.controls.newManagerId.invalid" class="text-xs text-rose-400">
        Manager is required.
      </span>
    </div>
  </form>

  <kendo-dialog-actions>
    <button kendoButton (click)="cancelled.emit()" [disabled]="isSaving">Cancel</button>
    <button
      kendoButton
      themeColor="primary"
      (click)="submit()"
      [disabled]="isSaving || managers.length === 0">
      {{ isSaving ? 'Updating...' : 'Update Manager' }}
    </button>
  </kendo-dialog-actions>
</kendo-dialog>
